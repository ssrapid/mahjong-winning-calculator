<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>麻雀条件計算ツール</title>
    <link rel="stylesheet" href="./css/mainTable.css">
    <link rel="stylesheet" href="./css/tab.css">
    <link rel="stylesheet" href="./css/input.css">
  </head>

  <body>
    <div class="tab">
      <ul class="tab__menu">
        <li class="tab__menu-item is-active" data-tab="01">対局情報</li>
        <li class="tab__menu-item" data-tab="02">ルール設定</li>
        <li class="tab__menu-item" data-tab="03">menu3</li>
      </ul>
      <div class="tab__panel">
        <div id="tab__panel-main" class="tab__panel-box tab__panel-box0 is-show" data-panel="01"></div>
        <div id="tab__panel-rule" class="tab__panel-box tab__panel-box0" data-panel="02"></div>
        <div class="tab__panel-box tab__panel-box0" data-panel="03">
          <p class="tab__panel-text">3</p>
        </div>
      </div>
    </div>



    <script src="./js/myUtilities.js"></script>
    <script src="./js/seatUtilities.js"></script>
    <script src="./js/tab.js"></script>
    <script src="./js/mainTable.js"></script>
    <script>
      loadHTML(
        document.getElementById("tab__panel-main"),
        "./tabpanels/main.html",
        () => buildMainTable(document.getElementById("main-table-root")));
      loadHTML(
        document.getElementById("tab__panel-rule"),
        "./tabpanels/rule.html");
    </script>

    <script src="./js/app.js"></script>
  </body>
</html>
