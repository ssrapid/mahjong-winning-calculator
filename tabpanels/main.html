<div id="main-table-root">
  <table id="mainTable" class="main-table">
    <thead id="mainTable_thead">
      <tr id="tr_input_name">
        <th>対局者名</th>
        <th colspan="2">
          <input type="text"
            id="input_name_e"
            class="input-name input-player input-player_e"
            placeholder="対局者名(東家)" data-field="name" data-value-type="string" data-seat="e">
        </th>
        <th colspan="2">
          <input type="text"
            id="input_name_s"
            class="input-name input-player input-player_s"
            placeholder="対局者名(南家)" data-field="name" data-value-type="string" data-seat="s">
        </th>
        <th colspan="2">
          <input type="text"
            id="input_name_w"
            class="input-name input-player input-player_w"
            placeholder="対局者名(西家)" data-field="name" data-value-type="string" data-seat="w">
        </th>
        <th colspan="2">
          <input type="text"
            id="input_name_n"
            class="input-name input-player input-player_n"
            placeholder="対局者名(北家)" data-field="name" data-value-type="string" data-seat="n">
        </th>
        <th class="button-only">
          <!-- 未実装のためdisabled -->
          <button id="button_change_seat" class="button-shortcut" tabindex="-1" disabled>席替え</button>
        </th>
      </tr>
      <tr id="tr_input_point">
        <th>ポイント</th>
        <td colspan="2">
          <input type="number"
            id="input_point_e"
            class="input-point input-player input-player_e"
            value="0.0" step="0.1" data-field="point" data-value-type="number" data-seat="e">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_point_s"
            class="input-point input-player input-player_s"
            value="0.0" step="0.1" data-field="point" data-value-type="number" data-seat="s">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_point_w"
            class="input-point input-player input-player_w"
            value="0.0" step="0.1" data-field="point" data-value-type="number" data-seat="w">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_point_n"
            class="input-point input-player input-player_n"
            value="0.0" step="0.1" data-field="point" data-value-type="number" data-seat="n">
        </td>
        <td class="button-only">
          <button id="button_reset_point" class="button-shortcut" data-field="point" data-value="0.0" tabindex="-1">
            Reset
          </button>
        </td>
      </tr>
      <tr id="tr_input_score">
        <th>持ち点</th>
        <td colspan="2">
          <input type="number"
            id="input_score_e"
            class="input-score input-player input-player_e"
            step="100" data-field="score" data-value-type="number" data-seat="e">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_score_s"
            class="input-score input-player input-player_s"
            step="100" data-field="score" data-value-type="number" data-seat="s">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_score_w"
            class="input-score input-player input-player_w"
            step="100" data-field="score" data-value-type="number" data-seat="w">
        </td>
        <td colspan="2">
          <input type="number"
            id="input_score_n"
            class="input-score input-player input-player_n"
            step="100" data-field="score" data-value-type="number" data-seat="n">
        </td>
        <td class="button-only">
          <button id="button_reset_score" class="button-shortcut" data-field="score" tabindex="-1">
            Reset
          </button>
        </td>
      </tr>
      <tr id="tr_input_dealer">
        <th>親番</th>
        <td colspan="2">
          <label>
            <input type="radio"
              id="input_dealer_e"
              class="input-dealer input-player input-player_e"
              name="radio_dealer" value="e" data-field="dealer" data-seat="e">
            親番
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="radio"
              id="input_dealer_s"
              class="input-dealer input-player input-player_s"
              name="radio_dealer" value="s" data-field="dealer" data-seat="s">
            親番
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="radio"
              id="input_dealer_w"
              class="input-dealer input-player input-player_w"
              name="radio_dealer" value="w" data-field="dealer" data-seat="w">
            親番
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="radio"
              id="input_dealer_n"
              class="input-dealer input-player input-player_n"
              name="radio_dealer" value="n" data-field="dealer" data-seat="n" checked>
            親番
          </label>
        </td>
        <td></td>
      </tr>
      <tr>
        <th>供託・積み棒</th>
        <td colspan="9">
          <div class="tr-kyotaku-tsumibo">
            <div>
              <label>
                <input type="checkbox" id="input_finalRound" data-field="finalRound" checked>
                オーラス
              </label>
            </div>
            <div>
              <label>積み棒:
                <input type="number" id="input_tsumibo" value="0" min="0" data-field="tsumibo">
              </label>
              <button id="button_increment_tsumibo" data-field="tsumibo" data-add="+1" tabindex="-1">
                +1
              </button>
              <button id="button_reset_tsumibo" data-field="tsumibo" data-value="0" tabindex="-1">
                Reset
              </button>
            </div>
            <div>
              <label>供託:
                <input type="number" id="input_kyotaku" value="0" min="0" data-field="kyotaku">
              </label>
              <button id="button_increment_kyotaku" data-field="kyotaku" data-add="+1" tabindex="-1">
                +1
              </button>
              <button id="button_reset_kyotaku" data-field="kyotaku" data-value="0" tabindex="-1">
                Reset
              </button>
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <th>リーチ</th>
        <td colspan="2">
          <label>
            <input type="checkbox" id="input_riichi_e" class="input-riichi input-player input-player_e" data-field="riichi" data-seat="e">
            リーチ
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="checkbox" id="input_riichi_s" class="input-riichi input-player input-player_s" data-field="riichi" data-seat="s">
            リーチ
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="checkbox" id="input_riichi_w" class="input-riichi input-player input-player_w" data-field="riichi" data-seat="w">
            リーチ
          </label>
        </td>
        <td colspan="2">
          <label>
            <input type="checkbox" id="input_riichi_n" class="input-riichi input-player input-player_n" data-field="riichi" data-seat="n">
            リーチ
          </label>
        </td>
        <td class="button-only">
          <button id="button_reset_riichi" class="button-shortcut" data-field="riichi" data-value="false" tabindex="-1">
            Reset
          </button>
        </td>
      </tr>
    </thead>
    <tbody id="tbody_tentative" class="mainTable-tbody">
      <tr>
        <th>Game</th>
        <td colspan="2" class="td-tentative-game-point" data-seat="e">(計算前)</td>
        <td colspan="2" class="td-tentative-game-point" data-seat="s">(計算前)</td>
        <td colspan="2" class="td-tentative-game-point" data-seat="w">(計算前)</td>
        <td colspan="2" class="td-tentative-game-point" data-seat="n">(計算前)</td>
        <td rowspan="2" class="button-only">
          <button id="button_compute_tentative" class="button-shortcut" tabindex="-1">
            計算
          </button>
        </td>
      </tr>
      <tr>
        <th>Total</th>
        <td colspan="2" class="td-tentative-total-point" data-seat="e">(計算前)</td>
        <td colspan="2" class="td-tentative-total-point" data-seat="s">(計算前)</td>
        <td colspan="2" class="td-tentative-total-point" data-seat="w">(計算前)</td>
        <td colspan="2" class="td-tentative-total-point" data-seat="n">(計算前)</td>
      </tr>
      <tr>
        <th>条件</th>
        <td colspan="8" id="td-addCondition">
          <div id="div-addCondition">
            <button id="button-addCondition">＋ 追加</button>
            <div id="conditionContainer" class="condition-container is-empty"></div>
          </div>
        </td>
        <td></td>
      </tr>
    </tbody>
  </table>
</div>
<div style="text-align: center; margin-top: 20px;">
  <button id="button_calculate">条件を計算する</button>
</div>
