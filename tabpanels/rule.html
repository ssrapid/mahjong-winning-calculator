
<div>
  <label>ベースルール:
    <select id="select_baseRule">
    <!-- optionsは動的生成 -->
    </select>
  </label>
  <span id="warning_baseRule">
    ⚠️必ず最初にベースルールを指定してください。
  </span>
</div>

<div>
  <label>
    <input type="number" id="input_rule_initialScore" data-field="rule_initialScore" step="100">
    点持ち
  </label>
  <label>
    <input type="number" id="input_rule_returnScore" data-field="rule_returnScore" step="100">
    点返し
  </label>
</div>

              <input type="number"
                id="input_ranking_point_1-1"

          <td>

  <div>

    <label>
      テンパイ料: 場に
      <input  type="number" id="input_rule_tenpaiFee" data-field="tenpaiFee">
      点
    </label>

    <label>切り上げ満貫:
      <select id="select_rule_roundingMangan">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>トビ終了:
      <select id="select_rule_allowGameEndByNegative">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>アガリやめ:
      <select id="select_rule_endOnAWin">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>テンパイやめ:
      <select id="select_rule_endOnATenpai">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>西入:
      <select id="select_rule_allowWestRound">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>
      トップ必要点数:
      <input  type="number" id="input_rule_minimumTopScore" data-field="minimumTopScore" step="100" disabled>
      点
    </label>

  </div>

  <div>
    <label>同点時の順位:
      <select id="select_rule_tieScoreRule">
        <!-- スクリプトで選択肢を入れる -->
      </select>
    </label>

    <label>終局時の残供託:
      <select id="select_rule_kyotakuSettlement">
        <!-- スクリプトで選択肢を入れる -->
      </select>
    </label>

    <label>連荘条件:
      <select id="select_rule_renchanRule">
        <!-- スクリプトで選択肢を入れる -->
      </select>
    </label>

    <label>積み棒の加算:
      <select id="select_rule_incrementTsumibo">
        <option value="true" data-value-type="boolean">あり</option>
        <option value="false" data-value-type="boolean">なし</option>
      </select>
    </label>

    <label>最大和了点:
      <select id="select_rule_maxYakumanLimit">
        <option value="1" data-value-type="number">役満</option>
        <option value="2" data-value-type="number">2倍役満</option>
        <option value="3" data-value-type="number">3倍役満</option>
        <option value="4" data-value-type="number">4倍役満</option>
        <option value="5" data-value-type="number">5倍役満</option>
        <option value="6" data-value-type="number">6倍役満</option>
      </select>
    </label>

  </div>

</div>
